name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

env:
  # Opt into Node.js 24 for GitHub Actions (required after June 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Unbypassable guard against `--no-verify` / `LEFTHOOK=0` locally. Mirrors
  # the parent-side check that lefthook runs on pre-commit. Pointer-only
  # bumps pass; dirty submodule working trees fail.
  submodules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Verify submodules are clean
        run: just check-submodules-clean

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [submodules]
    container:
      image: ghcr.io/angzarr-io/angzarr-java:latest
      # The image's default user cannot write the runner's mounted temp dirs.
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # fetched below; recursive pulls angzarr-project's vendored trees

      - name: Configure git safe directory
        run: git config --global --add safe.directory '*'

      - name: Fetch submodules (non-recursive)
        run: git submodule update --init

      - name: Build
        run: just -f justfile.container build

      - name: Test (unit)
        run: just -f justfile.container test-unit

      - name: Lint
        run: just -f justfile.container lint

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY

          # All jobs must pass to merge
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
